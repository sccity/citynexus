apiVersion: v1
kind: Secret
metadata:
  name: citynexus-dev
  namespace: webprod
type: Opaque
stringData:
  APP_DEBUG: "false"
  APP_ENV: "dev"
  APP_KEY: "${APP_KEY}"
  APP_NAME: "CityNexus Dev"
  APP_URL: "https://citynexus-dev.santaclarautah.gov"
  
  # Database Configuration
  DB_CONNECTION: "mysql"
  DB_DATABASE: "citynexus_dev"
  DB_HOST: "apps.db.svc.cluster.local"
  DB_PASSWORD: "${DB_PASSWORD}"
  DB_PORT: "3306"
  DB_USERNAME: "${DB_USERNAME}"
  
  # GovTxt Database
  GOVTXT_DB_CONNECTION: "govtxt"
  GOVTXT_DB_DATABASE: "govtxt"
  GOVTXT_DB_HOST: "apps.db.svc.cluster.local"
  GOVTXT_DB_PASSWORD: "${GOVTXT_DB_PASSWORD}"
  GOVTXT_DB_PORT: "3306"
  GOVTXT_DB_USERNAME: "${GOVTXT_DB_USERNAME}"
  
  # Keycloak Configuration
  KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
  KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
  KEYCLOAK_REDIRECT_URI: "https://citynexus-dev.santaclarautah.gov/auth/callback"
  KEYCLOAK_BASE_URL: "https://sso.santaclarautah.gov"
  KEYCLOAK_REALM: "SANTACLARA-DEV"
  KEYCLOAK_OPENID_CONNECT_PATH: "/protocol/openid-connect"
  
  # Session Configuration
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_DOMAIN: ".santaclarautah.gov"
  SESSION_SECURE_COOKIE: "true"
  SESSION_HTTP_ONLY: "true"
  SESSION_SAME_SITE: "lax"
  
  # Service Health Database
  SERVICE_HEALTH_DB_HOST: "apps.db.svc.cluster.local"
  SERVICE_HEALTH_DB_PORT: "3306"
  SERVICE_HEALTH_DB_DATABASE: "ServiceHealth"
  SERVICE_HEALTH_DB_USERNAME: "${SERVICE_HEALTH_DB_USERNAME}"
  SERVICE_HEALTH_DB_PASSWORD: "${SERVICE_HEALTH_DB_PASSWORD}" 